name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and sign Android APK
    runs-on: ubuntu-22.04

    steps:

      # ─────────────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # VERSION AUTOMATIQUE
      # ─────────────────────────────────────────────

      - name: Calculate version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="1.0.0"
          else
            VERSION="${LAST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))

            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Nouvelle version : $VERSION"
          echo "Nouveau tag : $TAG"

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      # ─────────────────────────────────────────────
      # NODE + PNPM
      # ─────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.15.0 --activate

      - name: Check pnpm
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────
      # RUST
      # ─────────────────────────────────────────────

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Cargo CLI
        run: |
          cargo install tauri-cli --version "^2" --locked

      - name: Check Tauri Cargo CLI
        run: |
          cargo tauri --version

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      # ─────────────────────────────────────────────
      # JAVA
      # ─────────────────────────────────────────────

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ─────────────────────────────────────────────
      # ANDROID SDK
      # ─────────────────────────────────────────────

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13846066"

      # ─────────────────────────────────────────────
      # TAURI CLI JS
      # ─────────────────────────────────────────────

      - name: Install Tauri CLI
        run: pnpm add -D @tauri-apps/cli

      - name: Check Tauri CLI
        run: |
          pnpm tauri --version
          cargo tauri --version

      # ─────────────────────────────────────────────
      # INITIALIZE ANDROID PROJECT
      # ─────────────────────────────────────────────

      - name: Initialize Android project
        run: |
          pnpm tauri android init

      # ─────────────────────────────────────────────
      # CONFIGURE UNIVERSAL APK
      # ─────────────────────────────────────────────

      - name: Configure Android ABI
        shell: bash
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "Fichier Gradle introuvable : $GRADLE_FILE"
            exit 1
          fi

          echo "Configuration du fichier : $GRADLE_FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          if "splits {" not in text:
              text += r'''

          android {
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
                      isUniversalApk = true
                  }
              }
          }
          '''

          path.write_text(text)
          PY

          echo "Configuration ABI terminée."

      # ─────────────────────────────────────────────
      # BUILD ANDROID
      # ─────────────────────────────────────────────

      - name: Build Tauri Android
        run: |
          pnpm tauri android build --apk

      # ─────────────────────────────────────────────
      # FIND UNIVERSAL APK
      # ─────────────────────────────────────────────

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          echo "APK générés :"

          find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f \
            -name "*universal*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Aucun APK universel trouvé."

            echo "Recherche de tous les APK disponibles :"
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK universel trouvé : $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # DECODE RELEASE KEYSTORE
      # ─────────────────────────────────────────────

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > epsilon-release.keystore

      # ─────────────────────────────────────────────
      # SIGN APK
      # ─────────────────────────────────────────────

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK="${{ steps.apk.outputs.apk }}"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks epsilon-release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out epsilon-release.apk \
            "$APK"

      # ─────────────────────────────────────────────
      # VERIFY SIGNATURE
      # ─────────────────────────────────────────────

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            epsilon-release.apk

      # ─────────────────────────────────────────────
      # VERIFY APK ABI
      # ─────────────────────────────────────────────

      - name: Verify APK architectures
        run: |
          echo "Architectures présentes dans l'APK :"

          unzip -l epsilon-release.apk | grep "lib/" || true

          echo ""
          echo "Informations APK :"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            epsilon-release.apk | \
            grep -E "package:|sdkVersion|targetSdkVersion|native-code"

      # ─────────────────────────────────────────────
      # RENAME APK
      # ─────────────────────────────────────────────

      - name: Rename APK
        run: |
          mv epsilon-release.apk \
            "epsilon-${{ steps.version.outputs.version }}-universal.apk"

      # ─────────────────────────────────────────────
      # UPLOAD ARTIFACT
      # ─────────────────────────────────────────────

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-${{ steps.version.outputs.version }}
          path: epsilon-${{ steps.version.outputs.version }}-universal.apk
          if-no-files-found: error